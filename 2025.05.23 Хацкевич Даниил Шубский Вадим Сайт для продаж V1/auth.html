<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация - MarketPlace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-wrapper">
            <div class="auth-header">
                <h2>Вход в аккаунт</h2>
                <p>Введите свои данные для входа</p>
            </div>
            
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Ваш email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Ваш пароль" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Запомнить меня
                    </label>
                    <a href="#" class="forgot-password">Забыли пароль?</a>
                </div>
                
                <button type="submit" class="btn-auth">Войти</button>
                
                <div class="auth-divider">
                    <span>или</span>
                </div>
                
                <div class="social-auth">
                    <button type="button" class="btn-social google">
                        <i class="fab fa-google"></i> Войти через Google
                    </button>
                    <button type="button" class="btn-social vk">
                        <i class="fab fa-vk"></i> Войти через ВКонтакте
                    </button>
                </div>
                
                <div class="auth-footer">
                    Нет аккаунта? <a href="#" id="switchToRegister">Зарегистрироваться</a>
                </div>
            </form>
            
            <form class="auth-form" id="registerForm" style="display: none;">
                <div class="form-group">
                    <label for="regName">Имя</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="regName" name="name" placeholder="Ваше имя" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="regEmail" name="email" placeholder="Ваш email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="regPassword">Пароль</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPassword" name="password" placeholder="Придумайте пароль" required>
                        <button type="button" class="toggle-password" id="toggleRegPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-hint">
                        Пароль должен содержать минимум 8 символов
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="regConfirmPassword">Подтвердите пароль</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="Повторите пароль" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="agree-terms">
                        <input type="checkbox" name="agree" required> Я согласен с <a href="#">условиями использования</a>
                    </label>
                </div>
                
                <button type="submit" class="btn-auth">Зарегистрироваться</button>
                
                <div class="auth-footer">
                    Уже есть аккаунт? <a href="#" id="switchToLogin">Войти</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
